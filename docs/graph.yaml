template: {headings: [Purpose, Tests, Changes, Gate, Risks]}
gate:
  # What CI's `build` job runs: the A3 host tty goldens, then the whole host test suite.
  # The i486 build and the `accept` job (A1, A2, A4, A5z, A6a) are CI evidence on each PR.
  command: "./accept.sh --tty-only; a=$?; cargo test --workspace --locked; t=$?; [ $a -eq 0 ] && [ $t -eq 0 ]"
  # Matched after stripping ANSI colour codes (\x1b\[[0-9;]*m) and a fetched CI log's
  # timestamp prefix (^\S+Z ). accept.sh prints `FAIL A<n>...`; libtest `test <path> ... FAILED`.
  fail_pattern: '^(FAIL A[0-9].*|test \S+ \.\.\. FAILED)$'
  # A5u fails at any checkout path but CI's: --chrome shows the fixture's file://<cwd>/... URL in the
  # address bar, and goldens/chrome-basic.png holds CI's container path. It passes in CI (SPEC.md D4).
  known_red:
    - "A5u: chrome screenshot of fixtures/basic.html differs from goldens/chrome-basic.png"
    # A1 fails in CI's `accept` job since ubuntu-latest became Ubuntu 26.04: its `file` prints
    # "Intel i386" and accept.sh greps "Intel 80386" (issue #117; SPEC.md D5). The node for #117 removes it.
    - "A1: expected 32-bit Intel 80386, statically linked"
out_of_scope:
  - {glob: "docs/superpowers/", reason: "design and plan docs of merged packets, kept as history; cited by doc-comments, never changed by a node"}
  - {glob: "JOURNAL.md", reason: "frozen append-only log; from now on the merged node PRs and the graph are the log"}
  - {glob: "LICENSE", reason: "the project's license text, not code"}
adoption:
  areas:
    - {name: layout, globs: ["src/layout/"]}
    - {name: fetch, globs: ["src/fetch/", "assets/", "tools/gen-attestations.py"]}
    - {name: render, globs: ["src/backend/", "src/surface/"]}
    - {name: shell, globs: ["src/main.rs", "src/lib.rs", "src/browser.rs", "src/form.rs", "src/frames.rs"]}
    - {name: goldens, globs: ["tests/", "fixtures/", "goldens/"]}
nodes:
  - id: B01
    name: crate-and-toolchain
    deps: []
    track: done
    status: imported
    owns: ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/", "targets/", ".gitignore"]
    summary: "The crate manifest (library and binary stele, five priced dependencies, size-first release profile), its lockfile, the pinned nightly, the cargo config (i486 linker, 16 MiB test-thread stack), the custom i486 musl target and the ignore list."
  - id: B02
    name: acceptance-script
    deps: [B01]
    track: done
    status: imported
    owns: ["accept.sh", "ci/"]
    summary: "accept.sh, the definition of done: A1, A2, A4, A5z and A6a on the i486 binary, the host golden, contrast and speed checks (--tty-only), the A6 covenant grep, --bless, and the audit-tool bootstrap ci/ensure-audit-tools.sh."
  - id: B03
    name: ci-workflows
    deps: [B01, B02]
    track: done
    status: imported
    owns: [".github/", "tools/render-gallery.sh"]
    summary: "The build-substrate and m0-acceptance workflows (host checks and unit tests, the i486 build, accept.sh under qemu, the non-gating X11 smoke) and the best-effort render gallery."
  - id: D01
    name: dom-tree
    deps: []
    track: done
    status: imported
    owns: ["src/dom/mod.rs", "src/dom/ast.rs"]
    summary: "The closed, arena-allocated document tree: Node is only Element or Text (the covenant, grepped by A6), Dom's arena under an html root, ElementName folded to lowercase, AttrMap with first-value-wins set and set_overwrite, Dom::set_attribute, and the dom module's re-exports."
  - id: D02
    name: html-parser
    deps: [D01]
    track: done
    status: imported
    owns: ["src/dom/parser.rs"]
    summary: "dom::parser::parse, the total, frozen-dialect tag-soup parser: explicit open-element stack, implied close, tolerant end tags, void elements, script discarded with its contents, style/textarea/title raw text, noscript first-class, comments dropped, attributes, and HTML 4.01 character references."
  - id: D03
    name: dom-util
    deps: [D01]
    track: done
    status: imported
    owns: ["src/dom_util.rs"]
    summary: "The crate-private DOM-walk helpers of forms and form-control rendering: DEPTH_CAP, is_checked, is_disabled, node_checked, collect_options and collect_text."
  - id: S01
    name: css-tokenizer
    deps: []
    track: done
    status: imported
    owns: ["src/style/tokenizer.rs"]
    summary: "The total CSS tokenizer: identifiers (custom-property names included), functions, at-keywords, hashes, strings, numbers, dimensions whose unit keeps its case, percentages, punctuation and kept whitespace; comments dropped."
  - id: S02
    name: computed-style
    deps: []
    track: done
    status: imported
    owns: ["src/style/computed.rs"]
    summary: "ComputedStyle, the frozen contract between style and layout: the curated computed properties, their enums and CSS initial values (border spacing 8px by 0 is Stele's own), ZIndex::layer and Content::generates_box."
  - id: S03
    name: contrast-repair
    deps: []
    track: done
    status: imported
    owns: ["src/style/contrast.rs"]
    summary: "The run-level contrast covenant: WCAG relative luminance and contrast ratio, the 3:1 CONTRAST_MIN floor, and repair_fg, which keeps a readable foreground and otherwise picks black or white."
  - id: S04
    name: css-values
    deps: [D01, S01, S02]
    track: done
    status: imported
    owns: ["src/style/value.rs"]
    summary: "The curated property and value layer: Declarations and overlay, apply_property for every curated property (colours, lengths, shorthands, borders, backgrounds and data: URLs, gradients as their first stop, fonts, flex, grid), var() substitution with fallbacks and cycle and depth limits, and the vintage HTML presentational hints."
  - id: S05
    name: css-parser
    deps: [D01, S01, S04]
    track: done
    status: imported
    owns: ["src/style/parser.rs", "src/style/selector.rs", "src/style/media.rs"]
    summary: "The total stylesheet parser with its recovery and counters, inline style, the curated selectors (descendant chains of element, *, id, class, exact attribute, :link, :visited, :root, ::before/::after) and their specificity, and @media queries (width features, prefers-color-scheme, fail-closed) with flatten_media and ColorScheme."
  - id: S06
    name: cascade
    deps: [D01, S02, S04, S05]
    track: done
    status: imported
    owns: ["src/style/cascade.rs", "src/style/ua.rs"]
    summary: "The cascade: UA sheet, presentational hints, author sheets and inline style folded by tier, specificity, sheet and source order with an explicit stack at any depth; custom-property environments and deferred var(); inheritance and unit resolution into ComputedStyle; ::before/::after styles; and the built-in UA stylesheet."
  - id: S07
    name: author-sheets
    deps: [D01, S01, S02, S03, S04, S05, S06]
    track: done
    status: imported
    owns: ["src/style/mod.rs", "src/style/author.rs"]
    summary: "The style module root and its re-exports, and the <style> collectors: collect_author_sheets in document order, the viewport-flattened variant, parse_and_flatten and media_attr_matches."
  - id: S08
    name: link-stylesheets
    deps: [D01, S05, S07]
    track: done
    status: imported
    owns: ["src/stylesheets.rs"]
    summary: "The driver-level pre-pass collecting <style> and fetched <link rel=stylesheet> sheets in document order: rel and media gates, href resolution against the base URL, skip on any fetch failure or non-CSS Content-Type, and the MAX_LINKS cap of 32 fetches."
  - id: T01
    name: terminus-glyphs
    deps: [S02]
    track: done
    status: imported
    owns: ["src/text/terminus_glyphs.rs", "src/text/terminus_glyphs_tests.rs", "tools/gen-terminus-glyphs.py", "third_party/"]
    summary: "The embedded font: the generated 191-glyph Terminus 4.49.1 subset (ASCII and Latin-1, 12/16/20/24/32px, normal and bold) with lookup and its hollow-box fallback, the BDF generator, the hand-checked table tests, and the OFL-1.1 license and attribution."
  - id: T02
    name: transliteration
    deps: []
    track: done
    status: imported
    owns: ["src/text/translit.rs"]
    summary: "resolve, the shared tty/pixel text seam: keep a char the embedded font covers, else its ASCII transliteration (dashes, curly quotes, ellipsis, bullet, arrow, NBSP, multiplication sign), else drop it and count it in the thread-local missing-glyph counter --stats reports."
  - id: T03
    name: text-metrics
    deps: [S02, T01, T02]
    track: done
    status: imported
    owns: ["src/text/mod.rs", "src/text/terminus.rs"]
    summary: "The text module root, the Metrics trait, TerminusFont's pinned per-bucket ascent, descent, line height and monospace advance, glyph widening with the bucket's ascent, and the nearest-of-five size snap (nearest_terminus_size, text_render_px)."
  - id: I01
    name: image-decoders
    deps: []
    track: done
    status: imported
    owns: ["src/img/"]
    summary: "The pure decoding layer: RgbaImage, Frame, the Decode trait and DecodeError, the shared 64M-pixel cap, magic-number sniffing and decode_bytes with its Content-Type hint and sniff fallback, the compositing animated GIF decoder, the baseline and progressive JPEG decoder (CMYK and 16-bit refused) and the normalising PNG decoder (APNG ignored)."
  - id: I02
    name: img-prepass
    deps: [D01, I01]
    track: done
    status: imported
    owns: ["src/images.rs"]
    summary: "collect_images, the pixel-path pre-pass that resolves, fetches and decodes every <img src> and <object data> to its first frame keyed by NodeId, deduped by resolved URL, bounded by MAX_IMAGES (256), MAX_TOTAL_IMAGE_BYTES (256 MiB) and a walk depth of 100; a failed load is left out."
  - id: I03
    name: bg-image-prepass
    deps: [S02, I01, I02]
    track: done
    status: imported
    owns: ["src/bg_images.rs"]
    summary: "collect_bg_images, the pixel-path pre-pass that loads every distinct CSS background_image of the cascaded styles to its first frame, keyed by the raw string and deduped by resolved URL, bounded by MAX_BG_IMAGES (32) and I02's byte budget; a failed load is left out."
