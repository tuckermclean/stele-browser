# Linker for the i486 floor target: the cross musl gcc built into the
# monolith-builder image (CROSS_COMPILE=i486-linux-musl-).
#
# NOTE: we deliberately do NOT set `[build] target` here. Host unit tests must
# build for the host; only the release binary targets i486, and it passes
# `--target targets/i486-monolith-linux-musl.json -Zbuild-std=std,panic_abort
# -Zjson-target-spec` (cargo flags) plus `RUSTFLAGS="-Zunstable-options
# -Cpanic=immediate-abort"` explicitly (see accept.sh and the build brief §2
# canonical command). -Cpanic=immediate-abort strips the formatted-message/
# fmt machinery panic=abort never uses anyway (packet size-squeeze-floppy)
# — `-C` is a rustc flag, not a cargo one, so it rides RUSTFLAGS on that one
# build invocation only, NEVER in Cargo.toml's [profile.release] (which the
# host test build shares and needs normal panic/assert + #[should_panic]
# behavior from) — so host tests are unaffected.
[target.i486-monolith-linux-musl]
linker = "i486-linux-musl-gcc"
# The target spec omits crt-objects-fallback / self-contained object lists, so
# self-contained linking is OFF: the image's cross musl toolchain
# (i486-linux-musl-gcc) supplies crt objects + static libc, and panic=abort
# needs no unwinder. (No link-self-contained rustflag — this target rejects it.)

# Give test threads a realistic stack. `cargo` forwards this env to the test
# binaries it runs, and libtest sizes each per-test thread by RUST_MIN_STACK.
# The `deeply_nested_*` recursion probes (box_tree, images, frames) build
# DOMs far past DEPTH_CAP to prove the cap TRUNCATES rather than aborts; in an
# unoptimized (debug) test build each `build_node_inner` frame is large, so
# ~DEPTH_CAP (100) capped frames sit right at libtest's default ~2 MB thread
# stack — marginal enough that a single added struct field can tip a probe
# into a false stack overflow. Production is unaffected (release-sized frames +
# the 8 MB main thread have ample margin for 100 frames); this only widens the
# TEST threads so frame-size marginality can't masquerade as a cap failure.
# 16 MiB. Release builds ignore it (it only sizes libtest's spawned threads).
[env]
RUST_MIN_STACK = "16777216"
