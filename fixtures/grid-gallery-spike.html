<!doctype html>
<html>
<head><title>Stele grid spike — render-gallery card grid pattern</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem; background: #f5f5f7; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.25rem;
  }
  .card {
    background: #fff;
    border: 1px solid #ddd;
    padding: 1rem;
    height: 120px;
  }
  .card h2 { margin: 0 0 0.6rem 0; font-size: 0.95rem; }
  .card1 { background: #ffe0e0; }
  .card2 { background: #e0ffe6; }
  .card3 { background: #e0ecff; }
  .card4 { background: #fff6d5; }
</style>
</head>
<body>
<div class="grid">
  <div class="card card1"><h2>basic.html</h2></div>
  <div class="card card2"><h2>flex-polite.html</h2></div>
  <div class="card card3"><h2>httpforever.html</h2></div>
  <div class="card card4"><h2>css1-float-5526c.html</h2></div>
</div>
</body>
</html>
