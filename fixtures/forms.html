<!doctype html>
<html>
<head><title>Forms Fixture</title></head>
<body>
<h1>Contact Us</h1>
<form action="/contact" method="post">
<p>Name: <input type="text" name="name" value="Ada" size="12"></p>
<p>Email: <input type="email" name="email" size="16"></p>
<p><input type="checkbox" name="subscribe" checked> Subscribe to newsletter</p>
<p>Favorite color:
<select name="color">
<option value="r">Red</option>
<option value="g" selected>Green</option>
<option value="b">Blue</option>
</select>
</p>
<p><input type="submit" value="Send"></p>
</form>
</body>
</html>
