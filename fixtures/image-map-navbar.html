<!doctype html>
<html>
<head><title>Image Map Navbar Fixture</title></head>
<body>
<h1>Client-side image map</h1>
<p>
<img src="image-map-navbar.gif" width="48" height="16" usemap="#navmap" alt="nav">
</p>
<map name="navmap">
<area shape="rect" coords="0,0,6,16" href="/home" alt="Home">
<area shape="rect" coords="6,0,11,16" href="/about" alt="About">
<area shape="rect" coords="11,0,16,16" href="/contact" alt="Contact">
</map>
</body>
</html>
