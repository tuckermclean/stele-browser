<!doctype html>
<html>
<head><title>Noscript Fixture</title></head>
<body>
<h1>No-JavaScript Fallback Content</h1>

<noscript>
<p>This paragraph lives inside a noscript element. Stele never runs script by
construction, so this content is exactly what should render -- always.</p>
</noscript>

<p>An ordinary paragraph, for contrast.</p>
</body>
</html>
