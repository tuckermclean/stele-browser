<!doctype html>
<html>
<head>
<title>Stele Grid &mdash; a card-grid layout (packet/css-grid)</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: #f5f5f7; font-family: sans-serif; }
  h1 { margin: 0 0 16px 0; font-size: 20px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }
  .card {
    height: 100px;
    border: 1px solid #ccc;
    padding: 10px;
    color: #222;
  }
  .card h2 { margin: 0; font-size: 14px; }
  .c1 { background: #ffd0d0; }
  .c2 { background: #d0ffd6; }
  .c3 { background: #d0e0ff; }
  .c4 { background: #fff2c0; }
  .c5 { background: #e6d0ff; }
  .c6 { background: #d0fff2; }
</style>
</head>
<body>
<h1>Card grid</h1>
<div class="grid">
  <div class="card c1"><h2>Card one</h2></div>
  <div class="card c2"><h2>Card two</h2></div>
  <div class="card c3"><h2>Card three</h2></div>
  <div class="card c4"><h2>Card four</h2></div>
  <div class="card c5"><h2>Card five</h2></div>
  <div class="card c6"><h2>Card six</h2></div>
</div>
</body>
</html>
