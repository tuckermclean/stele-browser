[package]
name = "stele"
version = "0.1.0"
edition = "2021"
description = "Stele — a finished document-web browser for the 486. No JavaScript, by construction (charter C3)."
repository = "https://github.com/tuckermclean/stele-browser"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "stele"
path = "src/lib.rs"

[[bin]]
name = "stele"
path = "src/main.rs"

# Image decoders (P4). i486-conscious features: jpeg-decoder without rayon
# (single-threaded — charter/brief §9: no async, no thread pool). These must
# build for the i486 floor under -Zbuild-std; that is exactly what this packet
# verifies. Fallbacks per brief §6 L4 (zune-* / defer a format) if any refuses.
[dependencies]
gif = "0.13"
jpeg-decoder = { version = "0.3", default-features = false }
png = "0.17"
rustix = { version = "1.1.4", default-features = false, features = ["termios"] }
# Trimmed to what block.rs/inline.rs actually use (charter §158: block flow
# = degenerate column flex + flexbox; no CSS grid, no taffy-side floats —
# floats are bespoke inline work, M4; no CSS calc() in the dialect). Default
# features also pull `grid` (and smallvec transitively via `grid`),
# `float_layout`, `calc`, and `detailed_layout_info` — all dead weight here;
# dropping them shrinks the binary (A2 <= 2.0 MB) and the vendoring/audit
# surface.
taffy = { version = "0.13", default-features = false, features = [
    "std",
    "taffy_tree",
    "flexbox",
    "block_layout",
    "content_size",
] }

# Charter C4: the rock does not unwind. Size-first for the 486 budget (A2 ≤ 2.0 MB).
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
