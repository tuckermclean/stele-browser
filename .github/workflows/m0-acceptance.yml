name: m0-acceptance

# M0 definition-of-done in CI: build the i486 binary with the canonical pipeline
# inside the monolith-builder image, then run accept.sh (A1 + A4 live).
#
# Split into two jobs on purpose:
#   build  — runs INSIDE the image (only there is the i486 cross musl toolchain).
#   accept — runs on the plain ubuntu host, where qemu-user is one apt away.
#            The binary is fully static (crt-static), so qemu-i386 needs no
#            loader or libs from the build image — the artifact runs anywhere.
#
# Image pinned by digest (charter C11): tag 20260811-b25ecd2b24a5.

on:
  push:
    branches: ["packet/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/tuckermclean/monolith-builder@sha256:c8978fe3b56cf6ec1714b1b878997c7082cbf9786caa2b8cbcdbd986169c0daf
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain identity
        run: |
          set -euxo pipefail
          rustc --version
          cargo --version
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          command -v "${CROSS_COMPILE}gcc"

      # A3 (tty golden): host-native, no qemu/i486 involvement, but IS
      # cargo-dependent — this job carries the pinned toolchain
      # (rust-toolchain.toml), the `accept` job below does not (qemu-user +
      # file only). `--tty-only` runs just this check under that pin,
      # reproducibly (no `+nightly`/floating-toolchain override — charter
      # C9). A1/A4 (the i486/qemu checks) stay in the `accept` job.
      #
      # packet t2-glyph-fallback: moved ahead of "Unit tests" below (was
      # originally the other way around) — a stale golden anywhere in
      # `cargo test --workspace` (an EXISTING `include_str!`/`include_bytes!`
      # golden gone stale because a shared render path legitimately changed,
      # not just a brand-new fixture with no golden yet) used to hard-block
      # this whole job at the "Unit tests" step, which has no `if: always()`,
      # which meant NEITHER this step NOR "Upload host binary" below ever
      # ran — so the one artifact needed to bless that stale golden could
      # never be produced. Building+uploading the host binary FIRST, unit
      # tests SECOND (also `if: always()` now, see below), breaks that
      # deadlock: this step's own `cargo build --release` (inside `accept.sh
      # --tty-only`'s A3 section) always runs, so the binary always reaches
      # the artifact, regardless of whether accept.sh's OWN checks (or the
      # later unit-test step) pass. `cargo test` is still exactly as strict
      # as before — it still runs and still fails the job on a red test —
      # it just no longer gates whether the blessing tool exists.
      - name: Acceptance — A3 tty golden (host, pinned toolchain)
        run: |
          set -euxo pipefail
          chmod +x accept.sh
          ./accept.sh --tty-only

      # packet t1d-httpforever: this is the ONLY mechanism for blessing PNG
      # goldens without a local build (charter/workflow constraint: goldens
      # are never self-blessed off an uncompiled render — brief §10 — and
      # this environment never runs `cargo build`/`test` locally at all, CI
      # does). The `accept.sh --tty-only` step just above already ran a
      # plain `cargo build --release` (its A3 section always rebuilds
      # target/release/stele — see accept.sh's own header comment), so the
      # host binary already exists here; this step just uploads it, it does
      # NOT rebuild. `if: always()` is deliberate: a brand-new PNG golden
      # check landing in the SAME PR as its own fixture has no golden to
      # compare against yet, so `accept.sh --tty-only` above is EXPECTED to
      # fail on that first push — but the host binary it built along the way
      # must still reach this artifact so it can be downloaded, run once
      # outside CI to bless the golden, and committed in a follow-up push
      # (see fixtures/evidence/README.md's "httpforever" section for the
      # fixture this exists for).
      - name: Upload host binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stele-host
          path: target/release/stele
          if-no-files-found: error

      # Best-effort render gallery: renders every fixture in fixtures/*.html
      # through the host binary just built above ("Upload host binary"
      # already proves it exists by this point) and packages the PNGs, text
      # dumps, and a self-contained index.html as a downloadable artifact —
      # so a reviewer can SEE what a build renders without pulling and
      # running the binary themselves. `if: always()` + tools/render-
      # gallery.sh's own best-effort posture (a bad fixture is logged and
      # skipped, never fatal) means this never gates the build — it runs
      # even when the A3 accept.sh step above failed, and a single hostile
      # fixture can't fail it either.
      - name: Render gallery (all fixtures, best-effort)
        if: always()
        run: |
          set -euxo pipefail
          chmod +x tools/render-gallery.sh
          ./tools/render-gallery.sh target/release/stele renders

      - name: Upload renders gallery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders/
          if-no-files-found: warn

      # Host-target unit tests: the contract-tested logic (parser, cascade,
      # cookies, entity/line-break) runs natively here on the pinned nightly
      # (rust-toolchain.toml). Folded into this container job to avoid a second
      # image pull. `if: always()` (packet t2-glyph-fallback) for the same
      # reason "Upload host binary" above already has it: this step must
      # still run its real signal even when the PRECEDING accept.sh step
      # failed (e.g. mid-blessing-dance, same as this job's own artifact
      # step) — a red test still fails the job either way, this only
      # decouples "did tests pass" from "is the blessing binary available".
      - name: Unit tests (host target)
        if: always()
        run: |
          set -euxo pipefail
          cargo test --workspace --locked

      - name: Build i486 release binary (canonical pipeline)
        run: |
          set -euxo pipefail
          # The cross musl toolchain is GCC-based: it ships libgcc_eh.a (the
          # _Unwind_* API), not LLVM's libunwind. std's musl unwind crate asks
          # the linker for -lunwind; since panic=abort never unwinds, alias
          # libgcc_eh.a as libunwind.a so the reference resolves. (DECISIONS D7.)
          GCC_EH="$(${CROSS_COMPILE}gcc -print-file-name=libgcc_eh.a)"
          echo "libgcc_eh.a -> $GCC_EH"
          mkdir -p /tmp/unwindshim
          ln -sf "$GCC_EH" /tmp/unwindshim/libunwind.a
          export RUSTFLAGS="-L /tmp/unwindshim ${RUSTFLAGS:-}"
          # panic_immediate_abort (packet size-squeeze-floppy) strips std's
          # formatted-panic-message machinery from the release binary — the
          # 486 build already panic=abort's without unwinding, so the
          # formatted message was dead weight; this is the size lever that
          # keeps the i486 binary under the 1.44MB floppy ceiling (see
          # accept.sh's own note on this flag, and .cargo/config.toml).
          cargo build --release \
            --target targets/i486-monolith-linux-musl.json \
            -Zbuild-std=std,panic_abort \
            -Zbuild-std-features=panic_immediate_abort \
            -Zjson-target-spec
          BIN=target/i486-monolith-linux-musl/release/stele
          ls -l "$BIN"
          file "$BIN" || true

      - name: Upload i486 binary
        uses: actions/upload-artifact@v4
        with:
          name: stele-i486
          path: target/i486-monolith-linux-musl/release/stele
          if-no-files-found: error

  accept:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install qemu-user (A4 — execute the i486 binary)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user file

      - name: Download i486 binary
        uses: actions/download-artifact@v4
        with:
          name: stele-i486
          path: target/i486-monolith-linux-musl/release/

      # A1 + A4 live here (the i486 artifact + qemu). A3 (tty golden) already
      # ran, live, in the `build` job above — this plain-ubuntu job has no
      # Rust toolchain, so accept.sh's cargo-dependent A3 block degrades to
      # PENDING here rather than failing (see accept.sh's A3 section).
      - name: Run acceptance (A1 + A4 live)
        run: |
          chmod +x target/i486-monolith-linux-musl/release/stele accept.sh
          ./accept.sh
